name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Current dependency pins support Python 3.10-3.11.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit dependency advisories
        if: matrix.python-version == '3.11'
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

      - name: Run the test suite
        # The suite makes no network calls — conftest.py replaces the HTTP
        # session with a stub that raises — so no API key is needed. The dummy
        # value only satisfies resolve.py's startup check.
        env:
          GEOAPIFY_API_KEY: not-a-real-key
        run: python -m pytest scripts/tests/ -v

      - name: Run the documented offline demo
        # Includes extraction, ZIP-based county/FIPS derivation, and creation of
        # a weighted validation-coding sample. No API key or live geocoder call.
        run: bash scripts/demo.sh ./ci-output
